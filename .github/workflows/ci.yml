name: curriculum-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g markdownlint-cli@0.41.0
      - run: markdownlint "**/*.md" --ignore node_modules

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starters/typescript-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r starters/python-api/requirements-dev.txt
      - run: python -m ruff check starters/python-api
      - run: PYTHONPATH=starters/python-api pytest starters/python-api/tests -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: gofmt -l starters/go-service
      - run: test -z "$(gofmt -l starters/go-service)"
      - run: go test ./starters/go-service/...

  codespaces-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: jq -e . .devcontainer/devcontainer.json
      - run: docker compose -f docker-compose.dev.yml config >/dev/null
